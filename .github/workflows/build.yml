name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Giai nen project
        run: unzip -q "$(ls *.zip | head -1)"
      - name: Build APK
        run: |
          cd PokerTracker
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Doi ten file
        run: cp PokerTracker/app/build/outputs/apk/debug/app-debug.apk poker-tracker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: poker-tracker-apk
          path: poker-tracker.apk
      - name: Tao Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" poker-tracker.apk \
            --title "Poker Tracker v${{ github.run_number }}" \
            --notes "Bam vao poker-tracker.apk ben duoi de tai ve dien thoai roi cai dat."
